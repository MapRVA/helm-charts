{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memgraph-network-policy
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: memgraph
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Bolt connections from frontend
    - from:
        - podSelector:
            matchLabels:
              app: yesterdays-frontend
      ports:
        - protocol: TCP
          port: 7687
    # Allow Bolt connections from background workers
    - from:
        - podSelector:
            matchLabels:
              app: yesterdays-background-worker
      ports:
        - protocol: TCP
          port: 7687
    # Allow Bolt connections from urgent workers
    - from:
        - podSelector:
            matchLabels:
              app: yesterdays-urgent-worker
      ports:
        - protocol: TCP
          port: 7687
    # Allow Bolt connections from celery-beat
    - from:
        - podSelector:
            matchLabels:
              app: yesterdays-celery-beat
      ports:
        - protocol: TCP
          port: 7687
    # Allow Bolt connections from import
    - from:
        - podSelector:
            matchLabels:
              app: yesterdays-import
      ports:
        - protocol: TCP
          port: 7687
    {{- if .Values.metrics.enabled }}
    # Allow Prometheus to scrape the OpenMetrics endpoint
    - from:
        - namespaceSelector:
            {{- toYaml .Values.metrics.networkPolicy.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.metrics.networkPolicy.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 9091
    {{- end }}
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.dns.namespace }}
          podSelector:
            {{- toYaml .Values.networkPolicies.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
